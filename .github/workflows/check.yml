# Checks that the four pages are built from the current source and load nothing from the network.
name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Pages match the source
        run: node build.mjs && git diff --exit-code -- '*.html'
      - name: No network requests
        run: "! grep -n -E '<link\\b|@import|https?://fonts' *.html src/*.html"
